<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffd45e">
<meta name="color-scheme" content="light only">
<meta name="description" content="지한이를 위한 놀이터 — 듣고 찾기, 짝 맞추기, 다른 거 찾기, 그림자 맞추기, 퍼즐">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>지한이 놀이터</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 첫 터치로 소리를 깨운다. 모바일 브라우저는 사용자가 만지기 전엔 소리를 못 낸다. -->
<div id="splash" class="splash">
  <div class="splash-inner">
    <div class="splash-emoji">🚒</div>
    <h1 class="splash-title">지한이 놀이터</h1>
    <button id="startBtn" class="start-btn" type="button">눌러서 시작! 👆</button>
    <p class="splash-hint">소리를 켜고 놀아주세요</p>
  </div>
</div>

<main id="app" class="app"></main>

<!-- 맞췄을 때 그림과 단어를 크게 보여주는 자리 -->
<div id="banner" class="banner" hidden></div>
<div id="fx" class="fx" aria-hidden="true"></div>

<script src="js/sound.js"></script>
<script src="js/art.js"></script>
<script src="js/data.js"></script>
<script src="js/photos.js"></script>
<script src="js/mine.js"></script>
<script src="js/puzzleok.js"></script>
<script src="js/lineart.js"></script>
<script src="js/drag.js"></script>
<script src="js/collect.js"></script>
<script src="js/level.js"></script>
<script src="js/engine.js"></script>
<script src="js/games/listen.js"></script>
<script src="js/games/oddone.js"></script>
<script src="js/games/puzzle.js"></script>
<script src="js/games/pattern.js"></script>
<script src="js/games/sequence.js"></script>
<script src="js/games/balloon.js"></script>
<script src="js/games/flashlight.js"></script>
<script src="js/games/color.js"></script>
<script src="js/games/voice.js"></script>
<script src="js/games/dots.js"></script>
<script src="js/games/maze.js"></script>
<script src="js/games/seriate.js"></script>
<script>
  Engine.boot();
  if ('serviceWorker' in navigator) {
    /* updateViaCache: 'none' — 폰이 sw.js 마저 저장해두면
       고친 걸 올려도 며칠씩 옛날 앱이 뜬다. 이 파일만은 늘 새로 받는다. */
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
        .catch(function () { /* 무시 */ });
    });
    /* 새 판이 올라오면 화면을 한 번 새로 고친다.
       안 그러면 새 코드와 옛날 화면이 섞여서 사진이 깨진 채로 보인다.
       처음 설치될 때도 이 일이 일어나는데, 그때는 이미 새 화면이므로
       새로고침하면 안 된다 — 놀던 게 끊긴다.
       reloaded 로 막지 않으면 새로고침이 끝없이 반복된다. */
    var hadWorker = !!navigator.serviceWorker.controller;
    var reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!hadWorker || reloaded) return;
      reloaded = true;
      location.reload();
    });
  }
</script>
</body>
</html>
