<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffd45e">
<meta name="color-scheme" content="light only">
<meta name="description" content="지한이를 위한 놀이터 — 듣고 찾기, 짝 맞추기, 다른 거 찾기, 그림자 맞추기, 퍼즐">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>지한이 놀이터</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 첫 터치로 소리를 깨운다. 모바일 브라우저는 사용자가 만지기 전엔 소리를 못 낸다. -->
<div id="splash" class="splash">
  <div class="splash-inner">
    <div class="splash-emoji">🚒</div>
    <h1 class="splash-title">지한이 놀이터</h1>
    <button id="startBtn" class="start-btn" type="button">눌러서 시작! 👆</button>
    <p class="splash-hint">소리를 켜고 놀아주세요</p>
  </div>
</div>

<main id="app" class="app"></main>

<!-- 맞췄을 때 그림과 단어를 크게 보여주는 자리 -->
<div id="banner" class="banner" hidden></div>
<div id="fx" class="fx" aria-hidden="true"></div>

<script src="js/sound.js"></script>
<script src="js/art.js"></script>
<script src="js/data.js"></script>
<script src="js/photos.js"></script>
<script src="js/mine.js"></script>
<script src="js/puzzleok.js"></script>
<script src="js/lineart.js"></script>
<script src="js/collect.js"></script>
<script src="js/level.js"></script>
<script src="js/engine.js"></script>
<script src="js/games/listen.js"></script>
<script src="js/games/oddone.js"></script>
<script src="js/games/zoom.js"></script>
<script src="js/games/puzzle.js"></script>
<script src="js/games/missing.js"></script>
<script src="js/games/howmany.js"></script>
<script src="js/games/pattern.js"></script>
<script src="js/games/sequence.js"></script>
<script src="js/games/where.js"></script>
<script src="js/games/balloon.js"></script>
<script src="js/games/flashlight.js"></script>
<script src="js/games/color.js"></script>
<script src="js/games/voice.js"></script>
<script>
  Engine.boot();
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* 무시 */ });
    });
  }
</script>
</body>
</html>
